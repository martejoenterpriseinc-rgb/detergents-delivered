name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: Lint, typecheck, test, validate, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dd_ci
          POSTGRES_PASSWORD: dd_ci_password
          POSTGRES_DB: detergents_delivered_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dd_ci -d detergents_delivered_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: development
      DATABASE_URL: postgresql://dd_ci:dd_ci_password@localhost:5432/detergents_delivered_ci?schema=public
      AUTH_SECRET: ci-only-placeholder-not-a-real-secret
      NEXTAUTH_URL: http://localhost:3000
      AUTH_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma generate
        run: npm run db:generate

      - name: Prisma validate
        run: npm run db:validate

      - name: Apply migrations
        run: npm run db:migrate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build
