name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: Lint, typecheck, test, validate, build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dd_ci
          POSTGRES_PASSWORD: dd_ci_password
          POSTGRES_DB: detergents_delivered_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dd_ci -d detergents_delivered_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: development
      DATABASE_URL: postgresql://dd_ci:dd_ci_password@localhost:5432/detergents_delivered_ci?schema=public
      AUTH_SECRET: synthetic-ci-only-runtime-secret-do-not-reuse-12345
      DD_ALLOW_DATABASE_TESTS: "true"
      DD_LOCAL_PROOF_STORAGE: "true"
      DD_BUSINESS_DOCUMENT_ACTIVE_KEY: test
      DD_BUSINESS_DOCUMENT_KEYS: '{"test":"3434343434343434343434343434343434343434343434343434343434343434"}'
      DD_SYNTHETIC_PREVIEW: "true"
      DEMO_MODE: "false"
      SEED_DEMO_CATALOG: "false"
      SEED_BOOTSTRAP_ADMIN: "false"
      NEXTAUTH_URL: http://localhost:3000
      AUTH_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma generate
        run: npm run db:generate

      - name: Prisma validate
        run: npm run db:validate

      - name: Apply migrations
        run: npm run db:migrate

      - name: Read-only database preflight and migration replay
        run: |
          npm run check:runtime
          npm run db:preflight
          node --import tsx scripts/check-record-preservation.ts capture /tmp/dd-release-records.json
          npm run db:migrate
          npm run db:preflight
          node --import tsx scripts/check-record-preservation.ts verify /tmp/dd-release-records.json
          node --import tsx scripts/deploy-refund-foundation.ts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build

      - name: Install test browser
        # Playwright downloads its pinned Chromium; the runner's optional Google
        # Chrome apt source is unrelated and can publish inconsistent indexes.
        # Keep Ubuntu sources and all package signature/hash checks enabled.
        run: |
          sudo python3 - <<'PYTHON'
          from pathlib import Path
          target = "dl.google.com/linux/chrome-stable/deb"
          for source in Path("/etc/apt/sources.list.d").glob("*.list"):
              lines = source.read_text().splitlines()
              updated = ["# Excluded unused Chrome source in CI: " + line
                         if target in line and line.lstrip().startswith("deb ") else line
                         for line in lines]
              if updated != lines:
                  source.write_text("\n".join(updated) + "\n")
                  print("Excluded optional Chrome source:", source.name)
          for source in Path("/etc/apt/sources.list.d").glob("*.sources"):
              blocks = source.read_text().split("\n\n")
              updated = []
              for block in blocks:
                  uris = [line.split(":", 1)[1].strip().split() for line in block.splitlines() if line.startswith("URIs:")]
                  if uris and all(target in uri for group in uris for uri in group):
                      block = "\n".join(line for line in block.splitlines() if not line.startswith("Enabled:")) + "\nEnabled: no"
                      print("Excluded optional Chrome source:", source.name)
                  updated.append(block)
              if updated != blocks:
                  source.write_text("\n\n".join(updated))
          PYTHON
          npx playwright install --with-deps chromium

      - name: Desktop and mobile startup acceptance
        run: npm run test:e2e

      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detergents-delivered-startup-evidence
          path: |
            playwright-report
            test-results
          retention-days: 14

      - name: Preserve finance workflow screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-workflow-screenshots
          path: |
            test-results/**/route-mileage.png
            test-results/**/manual-payment-approvals.png
            test-results/**/delivery-tips.png
          retention-days: 14
