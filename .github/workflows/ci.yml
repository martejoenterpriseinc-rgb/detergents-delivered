name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: Lint, typecheck, test, validate, build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dd_ci
          POSTGRES_PASSWORD: dd_ci_password
          POSTGRES_DB: detergents_delivered_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dd_ci -d detergents_delivered_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: development
      DATABASE_URL: postgresql://dd_ci:dd_ci_password@localhost:5432/detergents_delivered_ci?schema=public
      AUTH_SECRET: synthetic-ci-only-runtime-secret-do-not-reuse-12345
      DD_ALLOW_DATABASE_TESTS: "true"
      DD_LOCAL_PROOF_STORAGE: "true"
      DD_SYNTHETIC_PREVIEW: "true"
      DEMO_MODE: "false"
      SEED_DEMO_CATALOG: "false"
      SEED_BOOTSTRAP_ADMIN: "false"
      NEXTAUTH_URL: http://localhost:3000
      AUTH_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma generate
        run: npm run db:generate

      - name: Prisma validate
        run: npm run db:validate

      - name: Apply migrations
        run: npm run db:migrate

      - name: Read-only database preflight and migration replay
        run: |
          npm run check:runtime
          npm run db:preflight
          npm run db:migrate
          npm run db:preflight

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Desktop and mobile startup acceptance
        run: npm run test:e2e

      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detergents-delivered-startup-evidence
          path: |
            playwright-report
            test-results
          retention-days: 14
